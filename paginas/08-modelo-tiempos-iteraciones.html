      accion: "Simular el tiempo total del clúster con los tiempos reales, ordenando las síntesis por tiempo predicho contra orden aleatorio.",
      impacto: "medio", esfuerzo: "bajo", sugerida: null },
    { id: "M7", cat: "Evaluación", titulo: "Validación más robusta",
      evidencia: "Una sola partición de val y una sola semilla.",
      accion: "Validación cruzada agrupada por proyecto y varias semillas para dar la variación entre corridas. No se toca test.",
      impacto: "bajo", esfuerzo: "medio", sugerida: null },
    { id: "M8", cat: "Etiquetas", titulo: "Revisar las anomalías de la ronda 2.000",
      evidencia: "3 anomalías en train y 1 en test marcadas.",
      accion: "Medir cuánto cambian las métricas con y sin ellas y dejar documentado el criterio.",
      impacto: "bajo", esfuerzo: "bajo", sugerida: null }
  ],

  siguiente: {
    titulo: "Iteración 2: cambiar una sola cosa",
    principio: "Cada iteración cambia una sola cosa para poder atribuir la diferencia. Test ya se usó, así que se compara en val y se vuelve a mirar test solo al cerrar la iteración.",
    pasos: [
      "Reentrenar con ETIQUETAS = \"sin_esperas\" (M1) y comparar contra la iteración 1 en val.",
      "Reportar los dos tiempos con y sin esperas, con las mismas tablas de esta página.",
      "Si el R² de la lógica sube como se espera, decidir en la tesis qué tiempo se predice y pasar a M2 en la iteración 3."
    ],
    criterio: "Se considera mejora si el R² en log de la lógica sube y el dentro de ×2 no baja en val, con la cobertura de familias entre 75 % y 85 %."
  },

  archivos: [
    ["Modelos entrenados", "wa_hls4ml_modelo_tiempo_v2/modelos/modelos_tiempos_A_y_B.joblib"],
    ["Comparación de enfoques en test", "wa_hls4ml_modelo_tiempo_v2/test/comparacion_enfoques_test.csv"],
    ["Igual, sin esperas", "wa_hls4ml_modelo_tiempo_v2/test/comparacion_enfoques_test_sin_esperas.csv"],
    ["Igual, por familia", "wa_hls4ml_modelo_tiempo_v2/test/comparacion_enfoques_test_por_familia.csv"],
    ["Predicciones de test", "wa_hls4ml_modelo_tiempo_v2/test/predicciones_test.csv.gz"],
    ["Métricas de fallo", "wa_hls4ml_modelo_tiempo_v2/test/metricas_fallo.json"]
  ],

  // Números que se comparan entre iteraciones (pestaña «Comparar»)
  clave: {
    c_x2: 0.910, logic_x2: 0.922,
    c_err: 0.133, logic_err: 0.129,
    c_r2: 0.738, logic_r2: 0.383,
    c_ancho: 2.012, logic_ancho: 1.841,
    c_cob_min: 0.791, logic_cob_min: 0.767,
    fallo_auc: 0.915, fallo_auc_pr: 0.879
  },
  claveNota: "Enfoque A con ajuste por familia, test, todas las síntesis."
});
</script>

<script>
(function () {
  "use strict";
  var ITS = (window.ITERACIONES || []).slice().sort(function (a, b) { return a.id - b.id; });
  var main = document.getElementById("main"), tabs = document.getElementById("tabs");
  var fmt = function (x, d) { return (x == null || isNaN(x)) ? "—" : x.toFixed(d == null ? 3 : d).replace(".", ","); };
  var pct = function (x, d) { return (x == null) ? "—" : (x * 100).toFixed(d == null ? 1 : d).replace(".", ",") + " %"; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var VAR_COLOR = { "A": "var(--a)", "B": "var(--b)" };

  function kv(rows) {
    return '<dl class="kv">' + rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("") + "</dl>";
  }

  // ---------- barras horizontales: dentro de ×2 ----------
  function barras(it) {
    var T = it.tiempos, out = "";
    ["C-synth", "Lógica"].forEach(function (et) {
      var items = [];
      T.bases.filter(function (b) { return b.etapa === et; }).forEach(function (b) { items.push({ n: b.nombre, v: b.x2, c: "var(--base)" }); });
      ["A · por familia", "B · por familia"].forEach(function (nom) {
        var f = T.filas.filter(function (r) { return r.etapa === et && r.variante === nom; })[0];
        if (f) items.push({ n: "Enfoque " + nom.replace(" · por familia", ""), v: f.x2, c: VAR_COLOR[nom[0]], hi: true });
      });
      out += "<h3>" + et + "</h3>" + items.map(function (i) {
        return '<div class="barrow"><span' + (i.hi ? ' style="font-weight:600"' : "") + ">" + esc(i.n) + '</span><div class="track"><div class="fill" style="width:' + (i.v * 100) +
               "%;background:" + i.c + '"></div></div><span class="val">' + pct(i.v, 1) + "</span></div>";
      }).join("");
    });
    return out;
  }

  // ---------- tabla de métricas ----------
  function tablaTiempos(it) {
    var T = it.tiempos, head = ["Variante", "Dentro ×2", "Error rel. mediano", "sMAPE", "R² log", "Spearman", "Cobertura", "Mín. familia", "Ancho p90/p10"];
    var h = "<table><thead><tr>" + head.map(function (x, i) { return "<th" + (i === 0 ? ' class="l"' : "") + ">" + x + "</th>"; }).join("") + "</tr></thead><tbody>";
    ["C-synth", "Lógica"].forEach(function (et) {
      h += '<tr class="group"><td colspan="9">' + et + "</td></tr>";
      var rows = T.filas.filter(function (r) { return r.etapa === et; });
      var best = Math.max.apply(null, rows.map(function (r) { return r.x2; }));
      rows.forEach(function (r) {
        h += "<tr" + (r.x2 === best ? ' class="best"' : "") + '><td class="l">' + esc(r.variante) + "</td><td>" + fmt(r.x2) + "</td><td>" + fmt(r.err) + "</td><td>" + fmt(r.smape) +
             "</td><td>" + fmt(r.r2) + "</td><td>" + fmt(r.spearman) + "</td><td>" + fmt(r.cobertura) + '</td><td class="' + (r.minfam < 0.6 ? "num-bad" : "") + '">' + fmt(r.minfam) +
             "</td><td>" + fmt(r.ancho, 2) + "</td></tr>";
      });
    });
    return h + "</tbody></table>";
  }

  function tablaSinEsperas(it) {
    var T = it.tiempos, con = {};
    T.filas.forEach(function (r) { if (r.variante.indexOf("global") > -1) con[r.etapa + r.variante] = r; });
    var h = '<table><thead><tr><th class="l">Variante</th><th>×2 con esperas</th><th>×2 sin esperas</th><th>R² con esperas</th><th>R² sin esperas</th></tr></thead><tbody>';
    T.sinEsperas.forEach(function (s) {
      var c = con[s.etapa + s.variante];
      h += '<tr><td class="l">' + esc(s.etapa + " · " + s.variante) + "</td><td>" + fmt(c.x2) + "</td><td>" + fmt(s.x2) + "</td><td>" + fmt(c.r2) + '</td><td class="num-good">' + fmt(s.r2) + "</td></tr>";
    });
    return h + "</tbody></table>";
  }

  // ---------- cobertura por familia (puntos) ----------
  function cobertura(it, etapa) {
    var C = it.cobertura, fams = C.familias, data = C[etapa], names = Object.keys(data);
    var W = 760, H = 270, L = 70, R = 14, Tp = 14, Bt = 40, lo = 40, hi = 100;
    var x = function (v) { return L + (v - lo) / (hi - lo) * (W - L - R); };
    var rowH = (H - Tp - Bt) / fams.length;
    var cols = { "A · global": "var(--a)", "A · por familia": "var(--a)", "B · global": "var(--b)", "B · por familia": "var(--b)" };
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="Cobertura del rango 10 a 90 por familia">';
    for (var v = lo; v <= hi; v += 10) {
      s += '<line class="axis" x1="' + x(v) + '" x2="' + x(v) + '" y1="' + Tp + '" y2="' + (H - Bt) + '"/><text x="' + x(v) + '" y="' + (H - Bt + 16) + '" text-anchor="middle">' + v + " %</text>";
    }
    s += '<line class="target" x1="' + x(C.objetivo) + '" x2="' + x(C.objetivo) + '" y1="' + Tp + '" y2="' + (H - Bt) + '"/>';
    s += '<text x="' + x(C.objetivo) + '" y="' + (H - 8) + '" text-anchor="middle">objetivo ' + C.objetivo + " %</text>";
    fams.forEach(function (f, i) {
      var y = Tp + rowH * i + rowH / 2;
      s += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + esc(f) + "</text>";
      names.forEach(function (n, k) {
        var v = data[n][i], dy = (k - (names.length - 1) / 2) * 6, glob = n.indexOf("global") > -1;
        s += glob
          ? '<circle cx="' + x(v) + '" cy="' + (y + dy) + '" r="4.2" fill="none" stroke="' + cols[n] + '" stroke-width="1.8"><title>' + esc(n) + ": " + v + " %</title></circle>"
          : '<circle cx="' + x(v) + '" cy="' + (y + dy) + '" r="4.2" fill="' + cols[n] + '"><title>' + esc(n) + ": " + v + " %</title></circle>";
      });
    });
    return s + "</svg>";
  }

  // ---------- curva de aprendizaje ----------
  function curva(it) {
    var P = it.curva, W = 360, H = 200, L = 40, R = 24, Tp = 12, Bt = 34, lo = 0.3, hi = 1.0;
    function chart(k1, k2, ti, lo, hi) {
      var x = function (f) { return L + (f - 0.25) / 0.75 * (W - L - R); };
      var y = function (v) { return Tp + (hi - v) / (hi - lo) * (H - Tp - Bt); };
      var s = '<div><b style="font-size:13px">' + ti + '</b><svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + ti + '">';
      for (var v = Math.ceil(lo * 10) / 10; v <= hi + 1e-9; v += 0.1) s += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v.toFixed(1).replace(".", ",") + "</text>";
      P.forEach(function (p) { s += '<text x="' + x(p.fraccion) + '" y="' + (H - 12) + '" text-anchor="middle">' + Math.round(p.fraccion * 100) + " %</text>"; });
      [[k1, "var(--a)", "C-synth"], [k2, "var(--b)", "Lógica"]].forEach(function (z) {
        s += '<polyline fill="none" stroke="' + z[1] + '" stroke-width="2" points="' + P.map(function (p) { return x(p.fraccion) + "," + y(p[z[0]]); }).join(" ") + '"/>';
        P.forEach(function (p) { s += '<circle cx="' + x(p.fraccion) + '" cy="' + y(p[z[0]]) + '" r="3.5" fill="' + z[1] + '"><title>' + z[2] + " · " + Math.round(p.fraccion * 100) + " % de train: " + p[z[0]] + "</title></circle>"; });
      });
      return s + "</svg></div>";
    }
    return '<div class="legend"><span><i style="background:var(--a)"></i>C-synth</span><span><i style="background:var(--b)"></i>Lógica</span><span>Eje horizontal: fracción de train usada</span></div>' +
           '<div class="two">' + chart("c_x2", "logic_x2", "Dentro de ×2", 0.8, 0.9) + chart("c_r2", "logic_r2", "R² en log", 0.3, 0.9) + "</div>";
  }

  // ---------- fallo ----------
  function fallo(it) {
    var F = it.fallo, h = '<div class="two"><div><h3>Modelo contra tasa por familia</h3><table><thead><tr><th class="l">Métrica</th><th>Modelo</th><th>Solo familia</th></tr></thead><tbody>';
    F.resumen.forEach(function (r) { h += '<tr><td class="l">' + r[0] + "</td><td><b>" + fmt(r[1]) + "</b></td><td>" + fmt(r[2]) + "</td></tr>"; });
    h += "</tbody></table><h3>Si no se sintetizara con riesgo alto</h3><table><thead><tr><th>Umbral</th><th>Precisión</th><th>Recall</th><th>Horas de fallo evitadas</th><th>Horas buenas descartadas</th></tr></thead><tbody>";
    F.umbrales.forEach(function (u) { h += "<tr><td>" + fmt(u.u, 1) + "</td><td>" + fmt(u.prec) + "</td><td>" + fmt(u.rec) + '</td><td class="num-good">' + u.evitadas.toLocaleString("es") + '</td><td class="' + (u.descartadas > u.evitadas ? "num-bad" : "") + '">' + u.descartadas.toLocaleString("es") + "</td></tr>"; });
    h += "</tbody></table></div><div><h3>AUC dentro de cada familia</h3>";
    F.porFamilia.forEach(function (r) {
      h += '<div class="barrow"><span>' + r.f + ' <span class="meta">n=' + r.n.toLocaleString("es") + ", " + pct(r.tasa, 0) + ' fallan</span></span><div class="track">' +
           (r.auc == null ? "" : '<div class="fill" style="width:' + ((r.auc - 0.5) / 0.5 * 100) + '%;background:' + (r.auc < 0.75 ? "var(--b)" : "var(--a)") + '"></div>') +
           '</div><span class="val">' + (r.auc == null ? "sin fallos" : fmt(r.auc)) + "</span></div>";
    });
    return h + '<p class="meta">La barra va de AUC 0,5 (azar) a 1,0. Las tres familias sin fallos no se pueden evaluar.</p></div></div>';
  }

  // ---------- hallazgos y backlog ----------
  function hallazgos(it) {
    var lab = { ok: "Confirmado", warn: "Atención", info: "Observación" };
    return it.hallazgos.map(function (f) {
      return '<div class="find ' + f.tipo + '"><h4>' + esc(f.titulo) + '<span class="tag ' + f.tipo + '">' + lab[f.tipo] + "</span>" +
             (f.verificado === false ? '<span class="tag hip">por verificar</span>' : "") + "</h4><p>" + esc(f.texto) + "</p></div>";
    }).join("");
  }
  var catSel = "Todas";
  function backlog(it) {
    var cats = ["Todas"]; it.backlog.forEach(function (b) { if (cats.indexOf(b.cat) < 0) cats.push(b.cat); });
    var h = '<div class="filters" id="filt">' + cats.map(function (c) { return '<button aria-pressed="' + (c === catSel) + '" data-c="' + esc(c) + '">' + esc(c) + "</button>"; }).join("") + "</div>";
    it.backlog.filter(function (b) { return catSel === "Todas" || b.cat === catSel; }).forEach(function (b) {
      h += '<div class="card' + (b.sugerida ? " next" : "") + '"><header><span class="id">' + b.id + "</span><strong>" + esc(b.titulo) + '</strong><span class="chips">' +
           '<span class="chip">' + esc(b.cat) + '</span><span class="chip ' + b.impacto + '">impacto ' + b.impacto + '</span><span class="chip">esfuerzo ' + b.esfuerzo + "</span>" +
           (b.sugerida ? '<span class="chip alto">sugerida para iteración ' + b.sugerida + "</span>" : "") + "</span></header>" +
           "<p><b>Evidencia.</b> " + esc(b.evidencia) + "</p><p><b>Qué se haría.</b> " + esc(b.accion) + "</p></div>";
    });
    return h;
  }

  // ---------- vista de una iteración ----------
  function verIteracion(it) {
    var s = '<section><p class="meta"><span class="badge">' + esc(it.estado) + "</span> · " + esc(it.fecha) + " · " + esc(it.notebook) + "</p>" +
      "<h2 style=\"margin-top:8px\">Iteración " + it.id + " · " + esc(it.titulo) + '</h2><p class="lede">' + esc(it.subtitulo) + "</p>" +
      '<div class="panel"><p style="margin:0">' + esc(it.resumen) + "</p></div>" +
      '<div class="grid4">' + it.veredicto.map(function (v) { return '<div class="stat"><div class="v">' + esc(v.valor) + '</div><div class="l">' + esc(v.etiqueta) + '</div><div class="d">' + esc(v.detalle) + "</div></div>"; }).join("") + "</div>";

    s += '<h2>Qué se corrió</h2><div class="two"><div class="panel"><h3 style="margin-top:0">Configuración</h3>' + kv(it.configuracion) + '</div><div class="panel"><h3 style="margin-top:0">Datos</h3>' + kv(it.datos) + "</div></div>";

    s += "<h2>Tiempos: qué tan seguido acierta dentro de ×2</h2><p class=\"lede\">Porcentaje de síntesis cuyo tiempo predicho queda entre la mitad y el doble del real. Test, todas las síntesis.</p>" +
         '<div class="panel"><div class="legend"><span><i style="background:var(--base)"></i>Líneas base</span><span><i style="background:var(--a)"></i>Enfoque A</span><span><i style="background:var(--b)"></i>Enfoque B</span></div>' + barras(it) + "</div>";

    s += "<h2>Tabla completa</h2><p class=\"lede\">" + esc(it.tiempos.titulo) + ". En negrita, la mejor variante por dentro de ×2. «Mín. familia» es la peor cobertura entre las 7 familias (objetivo 80 %).</p>" +
         '<div class="panel tablewrap">' + tablaTiempos(it) + "</div>";

    s += "<h2>Efecto de las esperas del clúster</h2><p class=\"lede\">Mismo modelo, evaluado en test con y sin las síntesis que esperaron en el clúster. El modelo se entrenó con esperas.</p>" +
         '<div class="panel tablewrap">' + tablaSinEsperas(it) + "</div>";

    s += "<h2>Cobertura del rango 10–90 por familia</h2><p class=\"lede\">El rango debería contener el tiempo real el 80 % de las veces en cada familia. Círculo vacío: ajuste global. Círculo lleno: ajuste por familia.</p>" +
         '<div class="panel"><div class="seg" id="segcob"><button data-e="c" aria-pressed="true">C-synth</button><button data-e="logic" aria-pressed="false">Lógica</button></div>' +
         '<div class="legend"><span><i style="background:var(--a)"></i>Enfoque A</span><span><i style="background:var(--b)"></i>Enfoque B</span></div><div id="cobsvg">' + cobertura(it, "c") + "</div></div>";

    s += "<h2>Más datos, mejor modelo</h2><p class=\"lede\">Modelo B entrenado con una fracción de train y evaluado en val. Si la curva siguiera plana, más datos no ayudarían. No se aplana.</p>" +
         '<div class="panel">' + curva(it) + "</div>";

    s += "<h2>Fallo</h2><p class=\"lede\">Clasificador único para A y B, calibrado, en test.</p><div class=\"panel\">" + fallo(it) + "</div>";

    s += "<h2>Hallazgos</h2>" + hallazgos(it);

    s += "<h2>Camino a seguir: banco de mejoras</h2><p class=\"lede\">Cómo mejorar el dataset y el modelo, con la evidencia que lo respalda. Las marcadas son la propuesta para la siguiente iteración.</p><div id=\"bl\">" + backlog(it) + "</div>";

    var sg = it.siguiente;
    s += "<h2>" + esc(sg.titulo) + "</h2><div class=\"card next\"><p style=\"margin-top:0\">" + esc(sg.principio) + '</p><ol class="pasos">' + sg.pasos.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") +
         "</ol><p><b>Criterio de éxito.</b> " + esc(sg.criterio) + "</p></div>";

    s += "<h2>Archivos de esta iteración</h2><div class=\"panel\"><p class=\"meta\" style=\"margin-top:0\">Rutas dentro de <code>MyDrive</code>.</p>" + kv(it.archivos.map(function (a) { return [a[0], a[1]]; })).replace(/<dd>/g, "<dd><code>").replace(/<\/dd>/g, "</code></dd>") + "</div></section>";
    return s;
  }

  // ---------- comparar iteraciones ----------
  function comparar() {
    var rows = [
      ["Dentro de ×2 · C-synth", "c_x2", "alto", 3], ["Dentro de ×2 · Lógica", "logic_x2", "alto", 3],
      ["Error relativo mediano · C-synth", "c_err", "bajo", 3], ["Error relativo mediano · Lógica", "logic_err", "bajo", 3],
      ["R² en log · C-synth", "c_r2", "alto", 3], ["R² en log · Lógica", "logic_r2", "alto", 3],
      ["Ancho p90/p10 · C-synth", "c_ancho", "bajo", 2], ["Ancho p90/p10 · Lógica", "logic_ancho", "bajo", 2],
      ["Cobertura mínima por familia · C-synth", "c_cob_min", "alto", 3], ["Cobertura mínima por familia · Lógica", "logic_cob_min", "alto", 3],
      ["AUC de fallo", "fallo_auc", "alto", 3], ["AUC-PR de fallo", "fallo_auc_pr", "alto", 3]
    ];
    var h = '<section><h2 style="margin-top:8px">Comparar iteraciones</h2><p class="lede">Los mismos números clave de cada iteración, en test. Verde: mejoró contra la iteración anterior. Rojo: empeoró.</p><div class="panel tablewrap"><table><thead><tr><th class="l">Métrica</th>' +
            ITS.map(function (i) { return "<th>Iter. " + i.id + "</th>"; }).join("") + "</tr></thead><tbody>";
    rows.forEach(function (r) {
      h += '<tr><td class="l">' + r[0] + "</td>" + ITS.map(function (it, k) {
        var v = it.clave[r[1]], cls = "";
        if (k > 0) { var p = ITS[k - 1].clave[r[1]], d = v - p; if (Math.abs(d) > 1e-9) cls = ((d > 0) === (r[2] === "alto")) ? "num-good" : "num-bad"; }
        return '<td class="' + cls + '">' + fmt(v, r[3]) + "</td>";
      }).join("") + "</tr>";
    });
    h += "</tbody></table></div><h3>Qué cambió en cada una</h3>";
    ITS.forEach(function (it) { h += '<div class="card"><header><span class="id">Iter. ' + it.id + "</span><strong>" + esc(it.titulo) + '</strong><span class="meta">' + esc(it.fecha) + "</span></header><p>" + esc(it.resumen) + '</p><p class="meta">' + esc(it.claveNota || "") + "</p></div>"; });
    return h + "</section>";
  }

  // ---------- navegación ----------
  var vista = ITS.length ? String(ITS[ITS.length - 1].id) : "cmp";
  function pintarTabs() {
    var h = ITS.map(function (i) { return '<button role="tab" data-v="' + i.id + '" aria-selected="' + (String(i.id) === vista) + '">Iteración ' + i.id + "</button>"; }).join("");
    if (ITS.length > 1) h += '<button role="tab" data-v="cmp" aria-selected="' + (vista === "cmp") + '">Comparar</button>';
    tabs.innerHTML = h;
  }
  function pintar() {
    pintarTabs();
    if (!ITS.length) { main.innerHTML = '<div class="panel">No hay iteraciones cargadas. Revisa los <code>&lt;script&gt;</code> de <code>index.html</code>.</div>'; return; }
    var it = ITS.filter(function (i) { return String(i.id) === vista; })[0];
    main.innerHTML = (vista === "cmp" || !it) ? comparar() : verIteracion(it);
  }
  tabs.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; vista = b.dataset.v; try { location.hash = vista; } catch (x) {} pintar(); window.scrollTo(0, 0); });
  main.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var it = ITS.filter(function (i) { return String(i.id) === vista; })[0];
    if (b.closest("#filt")) { catSel = b.dataset.c; document.getElementById("bl").innerHTML = backlog(it); }
    if (b.closest("#segcob")) {
      Array.prototype.forEach.call(b.parentNode.children, function (x) { x.setAttribute("aria-pressed", x === b); });
      document.getElementById("cobsvg").innerHTML = cobertura(it, b.dataset.e);
    }
  });
  var h0 = (location.hash || "").replace("#", ""); if (h0 && (h0 === "cmp" || ITS.some(function (i) { return String(i.id) === h0; }))) vista = h0;
  pintar();
})();
